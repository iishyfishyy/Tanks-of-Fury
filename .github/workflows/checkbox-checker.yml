name: checkbox-checker

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: checkbox-checker-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  run:
    # Ignore non-PR issue_comment events
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest

    steps:
      # Resolve head_ref/head_sha for comment-triggered events
      - name: Get PR branch (for comment/review events)
        id: prref
        if: >
          github.event_name == 'issue_comment' ||
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'pull_request_review'
        uses: xt0rted/pull-request-comment-branch@v3

      # Compute the SHA to set status on (works for all events)
      - name: Compute head SHA
        id: head
        run: |
          if [ "${{ steps.prref.outputs.head_sha }}" != "" ]; then
            echo "sha=${{ steps.prref.outputs.head_sha }}" >> $GITHUB_OUTPUT
            echo "ref=${{ steps.prref.outputs.head_ref }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
            echo "ref=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          fi

      # Immediately mark status pending to eliminate auto-merge races
      - name: Set status pending
        uses: myrotvorets/set-commit-status-action@master
        with:
          sha: ${{ steps.head.outputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          context: checkbox-checker
          status: pending
          description: Re-evaluating PR comments for unchecked task items...

      - name: Scan PR comments/reviews for unchecked checkboxes
        id: scan
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let number = undefined;
            if (context.payload.pull_request) number = context.payload.pull_request.number;
            if (!number && context.payload.issue?.number) number = context.payload.issue.number;

            if (!number) {
              core.setOutput("hasUnchecked", "false");
              core.notice("No PR number found; skipping.");
              return;
            }

            // Fetch all three surfaces
            const [issueComments, reviewComments, reviews] = await Promise.all([
              github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 }),
              github.paginate(github.rest.pulls.listReviewComments, { owner, repo, pull_number: number, per_page: 100 }),
              github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 }),
            ]);

            const stripCode = (md) =>
              (md || "").replace(/```[\s\S]*?```/g, "").replace(/`[^`]*`/g, "");
            const unchecked = /(^|\s)[-*]\s*\[\s\]\s+/m;

            const texts = [
              ...issueComments.map(c => c.body || ""),
              ...reviewComments.map(c => c.body || ""),
              ...reviews.map(r => r.body || ""),
            ].map(stripCode);

            const hasUnchecked = texts.some(t => unchecked.test(t));
            core.setOutput("hasUnchecked", String(hasUnchecked));

      - name: Set final status
        if: always()
        uses: myrotvorets/set-commit-status-action@master
        with:
          sha: ${{ steps.head.outputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          context: checkbox-checker
          status: ${{ steps.scan.outputs.hasUnchecked == 'true' && 'failure' || 'success' }}
          description: ${{ steps.scan.outputs.hasUnchecked == 'true' && 'Unchecked task list item found in PR comments.' || 'No unchecked task items found.' }}
